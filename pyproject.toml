[project]
name = "airlock-gateway"
version = "0.1.0"
description = "Governance gateway between AI agents (MCP) and a SQL warehouse, with policy compiled live from DataHub."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Airlock Authors" }]
keywords = ["datahub", "mcp", "governance", "sql", "masking", "agents"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "sqlglot>=30,<31",
    "pydantic>=2.7,<3",
    "duckdb>=1.1,<2",
    "structlog>=24.1",
    "typer>=0.12,<1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "mcp>=1.2,<2",
    "acryl-datahub>=0.14,<1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
snowflake = ["snowflake-connector-python>=3.7"]
bigquery = ["google-cloud-bigquery>=3.20"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[project.scripts]
airlock = "airlock.cli.main:app"

[project.urls]
Homepage = "https://github.com/Purv-Kabaria/Airlock"
Repository = "https://github.com/Purv-Kabaria/Airlock"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["airlock", "tests", "demo", "tools"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "ASYNC",            # blocking-in-async lints (CLAUDE.md §12)
    "RUF",
    "SIM",
    "TID",
]
ignore = [
    "E501",       # line length handled by the formatter
    "B008",       # typer uses function-call defaults by design
    "ASYNC109",   # the WarehouseAdapter protocol takes an explicit timeout by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["airlock"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "datahub.*",
    "duckdb.*",
    "mcp.*",
    "sqlglot.*",
    "opentelemetry.*",
    "psycopg.*",
    "psycopg_pool.*",
    "snowflake.*",
    "google.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: talks to the real demo stack (DataHub + DuckDB); skipped in unit runs",
    "edge: covers a numbered row in the README edge-case table",
]
filterwarnings = ["error::DeprecationWarning:airlock.*"]
