<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Airlock — the governance gateway between AI agents and your data warehouse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a44"/>
      <stop offset="0.55" stop-color="#0b3d61"/>
      <stop offset="1" stop-color="#08243a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3df"/>
      <stop offset="1" stop-color="#1f77b4"/>
    </linearGradient>
    <linearGradient id="chamber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f5f"/>
      <stop offset="1" stop-color="#0c2c45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#7fc1f0" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M120 0 V340 M300 0 V340 M600 0 V340 M900 0 V340 M1080 0 V340"/>
  </g>

  <!-- lock mark -->
  <g transform="translate(96,110)">
    <circle r="52" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <circle r="34" fill="none" stroke="#4aa3df" stroke-width="3" opacity="0.5"/>
    <g stroke="#7fc1f0" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-34"/>
      <line x1="0" y1="52" x2="0" y2="34"/>
      <line x1="-52" y1="0" x2="-34" y2="0"/>
      <line x1="52" y1="0" x2="34" y2="0"/>
    </g>
    <circle r="13" fill="#4aa3df"/>
  </g>

  <text x="176" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#eaf4fc" letter-spacing="0.5">Airlock</text>
  <text x="178" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#9fc4e0">A governance gateway between your AI agents and your SQL warehouse.</text>

  <!-- flow: agent -> airlock -> warehouse -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- agent -->
    <g transform="translate(150,232)">
      <rect width="150" height="72" rx="12" fill="#0e3350" stroke="#2f6f9c" stroke-width="1.5"/>
      <text x="75" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#cfe6f7">AI agent</text>
      <text x="75" y="52" text-anchor="middle" font-size="12.5" fill="#7fa8c6">SELECT ... ssn ...</text>
    </g>

    <!-- arrow -->
    <g stroke="#4aa3df" stroke-width="2.5" fill="#4aa3df">
      <line x1="308" y1="268" x2="356" y2="268"/>
      <path d="M356 262 L370 268 L356 274 Z"/>
    </g>

    <!-- airlock chamber -->
    <g transform="translate(378,214)">
      <rect width="300" height="108" rx="14" fill="url(#chamber)" stroke="#4aa3df" stroke-width="2"/>
      <rect x="0" y="0" width="300" height="108" rx="14" fill="none" stroke="#7fc1f0" stroke-width="1" opacity="0.25"/>
      <text x="150" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#7fc1f0" letter-spacing="2">AIRLOCK</text>
      <g font-size="11.5" fill="#bcd9ef" text-anchor="middle">
        <text x="60" y="60">parse</text>
        <text x="150" y="60">resolve</text>
        <text x="240" y="60">decide</text>
        <text x="105" y="86">rewrite</text>
        <text x="200" y="86">audit</text>
      </g>
      <g stroke="#33628a" stroke-width="1">
        <line x1="105" y1="46" x2="105" y2="94"/>
        <line x1="195" y1="46" x2="195" y2="94"/>
      </g>
    </g>

    <!-- arrow -->
    <g stroke="#4aa3df" stroke-width="2.5" fill="#4aa3df">
      <line x1="686" y1="268" x2="734" y2="268"/>
      <path d="M734 262 L748 268 L734 274 Z"/>
    </g>

    <!-- warehouse -->
    <g transform="translate(756,232)">
      <rect width="164" height="72" rx="12" fill="#0e3350" stroke="#2f6f9c" stroke-width="1.5"/>
      <text x="82" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#cfe6f7">Warehouse</text>
      <text x="82" y="52" text-anchor="middle" font-size="12.5" fill="#7fa8c6">rows, ssn masked</text>
    </g>
  </g>

  <!-- DataHub source, top-right -->
  <g transform="translate(980,150)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="176" height="120" rx="14" fill="#0e3350" stroke="#2f6f9c" stroke-width="1.5"/>
    <text x="88" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#cfe6f7">DataHub</text>
    <g font-size="12" fill="#9fc4e0" text-anchor="middle">
      <text x="88" y="60">tags · glossary</text>
      <text x="88" y="80">lineage · lifecycle</text>
      <text x="88" y="100">the policy source</text>
    </g>
  </g>
  <g stroke="#4aa3df" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <path d="M980 210 C 820 210, 720 214, 640 214"/>
  </g>
  <text x="812" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7fa8c6">compile policy</text>
</svg>
