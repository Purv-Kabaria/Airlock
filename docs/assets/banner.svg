<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Airlock — a governance gateway between your AI agents and your SQL warehouse">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, "Roboto Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#0b1926"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#1c3a52" stroke-width="1"/>

  <!-- vault-hatch mark -->
  <g transform="translate(140,152)">
    <circle r="58" fill="none" stroke="#4aa3df" stroke-width="2.5"/>
    <circle r="46" fill="none" stroke="#2a5473" stroke-width="1.5"/>
    <g fill="#4aa3df">
      <circle cx="52" cy="0" r="3"/><circle cx="36.8" cy="36.8" r="3"/>
      <circle cx="0" cy="52" r="3"/><circle cx="-36.8" cy="36.8" r="3"/>
      <circle cx="-52" cy="0" r="3"/><circle cx="-36.8" cy="-36.8" r="3"/>
      <circle cx="0" cy="-52" r="3"/><circle cx="36.8" cy="-36.8" r="3"/>
    </g>
    <polygon points="19.05,11 0,22 -19.05,11 -19.05,-11 0,-22 19.05,-11" fill="#0b1926" stroke="#4aa3df" stroke-width="2"/>
    <circle r="5" fill="#4aa3df"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="232" y="138" class="sans" font-size="66" font-weight="800" letter-spacing="-1" fill="#eaf1f8">Airlock</text>
  <rect x="234" y="158" width="60" height="3" rx="1.5" fill="#4aa3df"/>
  <text x="234" y="191" class="sans" font-size="16" fill="#b8ccdc">A governance gateway for AI agents and your SQL warehouse.</text>

  <!-- capability chips -->
  <g class="mono" font-size="12.5" fill="#6f8ba3">
    <g>
      <rect x="234" y="216" width="54" height="30" rx="8" fill="none" stroke="#244258"/>
      <text x="261" y="235.5" text-anchor="middle">MCP</text>
    </g>
    <g>
      <rect x="298" y="216" width="112" height="30" rx="8" fill="none" stroke="#244258"/>
      <text x="354" y="235.5" text-anchor="middle">sqlglot AST</text>
    </g>
    <g>
      <rect x="420" y="216" width="152" height="30" rx="8" fill="none" stroke="#244258"/>
      <text x="496" y="235.5" text-anchor="middle">DataHub-compiled</text>
    </g>
    <g>
      <rect x="582" y="216" width="106" height="30" rx="8" fill="none" stroke="#244258"/>
      <text x="635" y="235.5" text-anchor="middle">fail-closed</text>
    </g>
  </g>

  <!-- live-verdict readout panel -->
  <g>
    <rect x="752" y="88" width="376" height="200" rx="14" fill="#13273a" stroke="#244258"/>
    <text x="776" y="123" class="mono" font-size="11.5" letter-spacing="1.5" fill="#6f8ba3">LIVE VERDICTS</text>
    <text x="1104" y="123" text-anchor="end" class="mono" font-size="11.5" fill="#3f5f79">req_01J9ZK3M</text>
    <line x1="776" y1="136" x2="1104" y2="136" stroke="#1f3f57"/>

    <!-- rows -->
    <g class="mono" font-size="14">
      <rect x="776" y="160" width="9" height="9" rx="2" fill="#4cc38a"/>
      <text x="798" y="169" fill="#dfeaf3">o.total</text>
      <text x="1104" y="169" text-anchor="end" font-size="12" letter-spacing="1" fill="#4cc38a">ALLOW</text>

      <rect x="776" y="200" width="9" height="9" rx="2" fill="#e0a94f"/>
      <text x="798" y="209" fill="#dfeaf3">email</text>
      <text x="1104" y="209" text-anchor="end" font-size="12" letter-spacing="1" fill="#e0a94f">MASK</text>

      <rect x="776" y="240" width="9" height="9" rx="2" fill="#e2687a"/>
      <text x="798" y="249" fill="#dfeaf3">ssn</text>
      <text x="1104" y="249" text-anchor="end" font-size="12" letter-spacing="1" fill="#e2687a">DENY</text>
    </g>
  </g>
</svg>
